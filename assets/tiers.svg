<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Explore는 손전등을 든 정찰자, worker는 곡괭이를 든 광부, reviewer는 돋보기를 든 검사관">
  <defs>
    <style>
      .t   { font: 600 19px system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .s   { font: 400 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill:#94a3b8; }
      .m   { font: 500 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill:#94a3b8; }
      .tag { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .fig { fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ══ panels ══ -->
  <rect x="8"   y="8" width="290" height="256" rx="16" fill="#38bdf8" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.32"/>
  <rect x="335" y="8" width="290" height="256" rx="16" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.32"/>
  <rect x="662" y="8" width="290" height="256" rx="16" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.32"/>

  <!-- ═══════════ 1. Explore — 손전등 든 정찰자 ═══════════ -->
  <text x="30" y="40" class="t" fill="#38bdf8">Explore</text>
  <text x="30" y="61" class="s">손전등 든 정찰자</text>
  <rect x="212" y="26" width="66" height="20" rx="10" fill="#38bdf8" fill-opacity="0.18"/>
  <text x="245" y="40" class="tag" fill="#38bdf8" text-anchor="middle">Haiku</text>

  <!-- 빛 번짐 -->
  <path d="M160 182 L131 238 L206 238 L177 182 Z" fill="#38bdf8" fill-opacity="0.12"/>
  <circle cx="168" cy="190" r="16" fill="#38bdf8" fill-opacity="0.18"/>
  <!-- 작은 몸집(아이 스케일) · 오른쪽을 향해 -->
  <g class="fig" stroke="#38bdf8">
    <circle cx="104" cy="128" r="14"/>
    <path d="M104 142 L104 186"/>
    <path d="M104 186 L91 214 M104 186 L117 214"/>
    <path d="M104 156 L82 174"/>
    <path d="M104 152 L152 146"/>
  </g>
  <!-- 손전등: 손끝에서 아래로 매달림 -->
  <g class="fig" stroke="#38bdf8">
    <path d="M152 146 L160 160"/>
    <rect x="158" y="160" width="20" height="22" rx="5"/>
  </g>
  <!-- 두리번거리는 물음표 -->
  <g class="fig" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2.6">
    <path d="M208 104 a7 7 0 1 1 7 9 v5"/><circle cx="215" cy="126" r="1.4" fill="#38bdf8" stroke="none"/>
    <path d="M56 98 a6 6 0 1 1 6 8 v4"/><circle cx="62" cy="116" r="1.2" fill="#38bdf8" stroke="none"/>
  </g>
  <!-- 지나온 발자국 -->
  <g fill="#38bdf8" fill-opacity="0.32">
    <ellipse cx="40" cy="232" rx="6" ry="4"/><ellipse cx="62" cy="240" rx="6" ry="4"/><ellipse cx="84" cy="232" rx="6" ry="4"/>
  </g>
  <text x="30" y="252" class="m">"어디에 뭐가 있나" — 찾아서 위치만 보고</text>

  <!-- ═══════════ 2. worker — 곡괭이 든 광부 ═══════════ -->
  <text x="357" y="40" class="t" fill="#f59e0b">worker</text>
  <text x="357" y="61" class="s">곡괭이 든 광부</text>
  <rect x="527" y="26" width="78" height="20" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <text x="566" y="40" class="tag" fill="#f59e0b" text-anchor="middle">Sonnet</text>

  <!-- 암벽 -->
  <path d="M596 88 L614 118 L600 148 L616 178 L602 208 L618 238 L622 238 L622 88 Z" fill="#f59e0b" fill-opacity="0.16"/>
  <!-- 광부: 안전모 + 두 손으로 곡괭이 -->
  <g class="fig" stroke="#f59e0b">
    <circle cx="412" cy="130" r="15"/>
    <path d="M395 122 a17 17 0 0 1 34 0"/>
    <path d="M412 145 L412 194"/>
    <path d="M412 194 L397 226 M412 194 L429 226"/>
    <path d="M412 158 L468 150"/>
    <path d="M412 170 L468 158"/>
  </g>
  <!-- 곡괭이: 자루(양손→위오른쪽) + 날(자루 끝에 가로지르는 호) -->
  <g class="fig" stroke="#f59e0b">
    <path d="M462 156 L546 114"/>
    <path d="M538 99 Q556 113 552 129"/>
  </g>
  <!-- 캐낸 광석 -->
  <g fill="#f59e0b" fill-opacity="0.55">
    <path d="M520 220 l13 -9 l12 10 l-6 13 l-14 1 z"/>
    <path d="M552 236 l9 -6 l8 7 l-4 9 l-11 1 z"/>
  </g>
  <text x="357" y="252" class="m">현장에서 실제로 캐낸다 — 방법은 스스로 판단</text>

  <!-- ═══════════ 3. reviewer — 돋보기 든 검사관 ═══════════ -->
  <text x="684" y="40" class="t" fill="#a78bfa">reviewer</text>
  <text x="684" y="61" class="s">돋보기 든 검사관</text>
  <rect x="866" y="26" width="66" height="20" rx="10" fill="#a78bfa" fill-opacity="0.18"/>
  <text x="899" y="40" class="tag" fill="#a78bfa" text-anchor="middle">Opus</text>

  <!-- 검사 대상(앞 두 tier의 산출물) -->
  <g fill="#94a3b8" fill-opacity="0.32">
    <path d="M694 200 l12 -8 l11 9 l-6 12 l-13 1 z"/>
    <path d="M694 228 l12 -8 l11 9 l-6 12 l-13 1 z"/>
  </g>
  <!-- 판정 -->
  <path d="M734 202 l7 8 l14 -16" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M735 226 l15 15 M750 226 l-15 15" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- 돋보기: 렌즈 + 손잡이가 검사관 손까지 이어짐 -->
  <circle cx="754" cy="138" r="28" fill="#a78bfa" fill-opacity="0.09"/>
  <g class="fig" stroke="#a78bfa">
    <circle cx="754" cy="138" r="28"/>
    <path d="M775 157 L806 170"/>
  </g>
  <!-- 검사관: 한발 물러서서, 뻗은 팔로 돋보기를 듦 -->
  <g class="fig" stroke="#a78bfa">
    <circle cx="884" cy="128" r="15"/>
    <path d="M884 143 L884 192"/>
    <path d="M884 192 L870 222 M884 192 L898 222"/>
    <path d="M884 160 L846 184 L806 170"/>
    <path d="M884 156 L910 174"/>
  </g>
  <text x="684" y="252" class="m">멀리서 하나하나 — "이거 진짜 맞아?"</text>

  <!-- ══ 인계 화살표 ══ -->
  <path d="M300 150 L331 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="316" y="140" class="m" text-anchor="middle" font-size="11">여기 있어요</text>
  <path d="M627 150 L658 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="643" y="140" class="m" text-anchor="middle" font-size="11">캤습니다</text>

  <!-- ══ 반증 되돌림 ══ -->
  <path d="M800 274 C 700 314, 560 314, 480 288" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.8" marker-end="url(#ar)"/>
  <text x="640" y="324" class="m" text-anchor="middle" fill="#a78bfa" fill-opacity="0.95">반증되면 되돌아간다 — 통과해야 '완료'</text>
</svg>
